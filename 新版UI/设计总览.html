<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BW-8200C · 新版 UI 设计总览</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5ebee;color:#2c4655;font:14px 'PingFang SC','Microsoft YaHei',sans-serif}header{height:86px;padding:21px 30px;background:#f8fafb;border-bottom:1px solid #d1dde3;display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0;letter-spacing:1px}header small{display:block;font-size:11px;letter-spacing:2px;color:#8b9da7;margin-top:8px}.tag{font-size:12px;color:#627f8d;border:1px solid #d0dce1;padding:8px 13px;border-radius:20px}.layout{display:grid;grid-template-columns:245px 1fr;height:calc(100vh - 86px)}aside{overflow:auto;background:#f4f7f8;padding:14px 12px;border-right:1px solid #d1dde3}aside h3{font-size:11px;letter-spacing:2px;color:#93a3ac;margin:25px 12px 12px}aside button{display:block;width:100%;border:0;padding:10px 13px;border-radius:8px;text-align:left;color:#4d6877;background:transparent;font:inherit;cursor:pointer;margin-bottom:2px;font-size:13px}aside button:hover{background:#e6eef1}aside button.active{background:#206b7f;color:#fff}.count{float:right;opacity:.5;font-size:11px}.content{overflow:auto;padding:24px 30px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.toolbar h2{font-size:20px;margin:0}.toolbar p{color:#8295a0;font-size:12px;margin:7px 0 0}.actions{display:flex;gap:8px}.actions button,.actions a{background:#f8fafb;border:1px solid #c5d3da;color:#466574;padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px;text-decoration:none}.actions button.active{background:#d0e3e9;border-color:#75a4b5}.frame-wrap{position:relative;width:100%;aspect-ratio:1280/800;box-shadow:0 18px 45px #294a5b18;border-radius:12px;overflow:hidden;border:1px solid #cbd9df;background:#fff}iframe{width:100%;height:100%;border:0;display:block}.old{position:absolute;inset:0;width:100%;height:100%;display:none}.old img{width:100%;height:100%;object-fit:fill}.legend{display:flex;justify-content:space-between;font-size:12px;color:#8296a2;margin-top:17px}.note{margin-top:23px;padding:17px 20px;background:#eff4f6;border:1px solid #d4e1e6;border-radius:10px;font-size:13px;color:#718b98;line-height:1.9}.note strong{color:#486d80}select{font:inherit;color:#466574;border:1px solid #c5d3da;border-radius:7px;padding:7px;max-width:280px;background:#f8fafb}#noticeControls{display:none;margin-bottom:14px}footer{font-size:11px;letter-spacing:1px;color:#9aabb4;margin-top:22px}@media(max-width:850px){.layout{grid-template-columns:185px 1fr}.content{padding:18px 14px}.actions{flex-wrap:wrap}.toolbar{align-items:flex-start}.tag{display:none}}
</style></head><body><header><div><h1>血液回收机 · 新版 UI 设计总览</h1><small>BW–8200C / INTERFACE DESIGN / 2026.11</small></div><div class="tag">1280 × 800 · 可交互设计稿</div></header><div class="layout"><aside id="sidebar"></aside><section class="content"><div class="toolbar"><div><h2 id="title"></h2><p id="source"></p></div><div class="actions"><button id="compare">查看旧版</button><button id="reload">重置演示</button><a id="open" target="_blank">单独打开 ↗</a></div></div><div id="noticeControls"><label>运行提示内容 <select id="noticeSelect"></select></label></div><div class="frame-wrap"><iframe id="preview" title="新版界面交互预览"></iframe><div class="old" id="old"><img id="oldImage" alt="旧版参考界面按比例映射到1280×800"></div></div><div class="legend"><span>设计画布 1280 × 800 · 按当前窗口等比预览</span><span id="kind">所有按键可点击</span></div><div class="note" id="note"></div><footer>本地离线设计预览 · 未连接医疗设备 · 未提供的参数显示为 — —</footer></section></div><script src="data.js"></script><script>
const data=window.UI_DATA,items=[...data.pages,...data.alarms.map(a=>({id:'alarm-'+a.id,title:a.name,group:'报警弹窗 · '+(a.level==='critical'?'红色':'琥珀色'),old:'47-报警切图.png',alarm:a.id}))];let current=items[0],showOld=false;const $=id=>document.getElementById(id);let groups=[...new Set(items.map(p=>p.group))];$('sidebar').innerHTML=groups.map(g=>'<h3>'+g+'<span class="count">'+items.filter(p=>p.group===g).length+'</span></h3>'+items.filter(p=>p.group===g).map(p=>'<button data-id="'+p.id+'">'+p.title+'</button>').join('')).join('');$('noticeSelect').innerHTML=data.messages.map((m,i)=>'<option value="'+i+'">'+m+'</option>').join('');function url(){return 'index.html?'+(current.alarm?'screen=main&alarm='+current.alarm:'screen='+current.id)+(current.id==='notice'?'&message='+$('noticeSelect').value:'')};function select(id){current=items.find(p=>p.id===id)||items[0];showOld=false;$('old').style.display='none';$('compare').textContent='查看旧版';$('compare').classList.remove('active');$('title').textContent=current.title;$('source').textContent='对应参考：'+current.old;$('preview').src=url();$('open').href=url();$('oldImage').src='../旧版参考/'+current.old;$('noticeControls').style.display=current.id==='notice'?'block':'none';$('note').innerHTML=current.alarm?'<strong>报警弹窗</strong>｜保留旧图报警名称与颜色分组，说明区使用可替换占位文字。确认代表已读；故障是否解除由设备状态决定。报警编号仅用于设计稿索引，不是设备故障码。':current.group==='帮助与视频'?'<strong>帮助资料</strong>｜内容与照片来自旧版文件。旧文案中的“继续”“半自动”等表述与主界面存在不一致，本稿保留原文供后续核对。视频素材未提供，已保留播放器与全部原有按键。':current.id==='debug'||current.id==='debugDetail'?'<strong>调试页面</strong>｜保留原有按键及可见数值。旧版未提供调试入口，当前由设计总览进入；实际产品入口待确认。':'<strong>布局保留，视觉更新</strong>｜按旧版坐标映射到新画布；按下效果、选中状态、管路流动和提示由界面代码呈现。点击按键可预览交互，未提供的设备数值、调节步长与限值不作推测。';document.querySelectorAll('[data-id]').forEach(b=>b.classList.toggle('active',b.dataset.id===current.id));history.replaceState(null,'','#'+current.id)}$('sidebar').onclick=e=>{const b=e.target.closest('[data-id]');if(b)select(b.dataset.id)};$('compare').onclick=()=>{showOld=!showOld;$('old').style.display=showOld?'block':'none';$('compare').textContent=showOld?'返回新版':'查看旧版';$('compare').classList.toggle('active',showOld)};$('reload').onclick=()=>{$('preview').src=url()};$('noticeSelect').onchange=()=>{$('preview').src=url();$('open').href=url()};select(location.hash.slice(1)||'main');
</script></body></html>
